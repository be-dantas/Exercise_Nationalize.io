spring.application.name=cadastro-pessoas
server.port=8080

# Saida enxuta: o log do framework fica em WARN, entao so avisos e erros
# aparecem. A aplicacao imprime a propria linha de "no ar" ao iniciar.
spring.main.banner-mode=off
logging.level.root=WARN
nationalize.url=https://api.nationalize.io

# Chave de demonstracao. Em producao viria de variavel de ambiente,
# nunca versionada. Documentada no README.
auth.api-key=chave-de-demonstracao-2026
